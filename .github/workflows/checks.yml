name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup:backend
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - name: Install Redis for disposable integration test
        run: sudo apt-get update -qq && sudo apt-get install -y redis-server
      - run: npm run test:redis
        env:
          REDIS_TEST_BINARY: /usr/bin/redis-server
      - run: npm run build:check
